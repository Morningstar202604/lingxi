# 智犀桌面版构建（Tauri 壳 + PyInstaller sidecar + Next.js 前端）
#
# 触发：手动（workflow_dispatch）或打 tag（v*）。
# 需要仓库 secrets（按需配置，缺省也能构建未签名产物）：
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_ID / APPLE_TEAM_ID  (macOS 签名/公证)
#   TAURI_PRIVATE_KEY / TAURI_KEY_PASSWORD                                     (更新包签名)
#
# 说明：Python sidecar 用 PyInstaller 打成单文件 exe，由 Tauri externalBin
# 打进安装包。构建前先跑后端测试做质量门禁。
name: build-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: 后端依赖 + 测试（质量门禁）
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pytest tests/ -q

      - name: 打包 Python sidecar
        run: python scripts/build_sidecar.py

      - name: 前端依赖
        working-directory: web
        run: npm ci

      - name: 构建并打包桌面版
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 签名（未配置 secrets 时自动跳过签名）
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "智犀桌面版 ${{ github.ref_name }}"
          releaseDraft: true
