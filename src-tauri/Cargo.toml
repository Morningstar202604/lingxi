[package]
name = "lingxi-desktop"
version = "0.2.0"
edition = "2021"

# 移动端（Android/iOS）通过 JNI/FFI 加载动态库，Tauri 要求侧提供 **cdylib**；
# 桌面端仍是 bin（main.rs 直接跑）。缺这个 [lib] 段时 `tauri android build`
# 报 "no library targets found in package"（实测）。
[lib]
name = "lingxi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["default"] }
tauri-macros = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# rustls-tls 而非默认的 native-tls：Android/iOS 上没有系统 OpenSSL，
# native-tls 会拉 openssl-sys 并在交叉编译时失败（实测：
# "Could not find directory of OpenSSL installation"）。rustls 是纯 Rust
# 实现，跨平台一致，也是 Tauri 官方文档对移动端的推荐。
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
# 每次安装随机生成本地管理令牌（uuid v4 底层 getrandom），持久化到数据目录
uuid = { version = "1", features = ["v4"] }

# ── 平台差异依赖（必须放文件末尾：TOML 里 [target.*] 之后的键都属于该段）──
#
# tokio 的 `process` 特性只用于桌面端的 sidecar 拉起；Android/iOS 不支持
# fork/exec，带该特性会在交叉编译时失败。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "time"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
