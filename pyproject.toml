[project]
name = "lingxi"
version = "0.1.0"
description = "灵犀 (LingXi) — 心有灵犀一点通。二十四小时在线的全栈数字员工引擎。"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "LingXi Team" }]
keywords = ["agent", "ai", "customer-service", "qq", "wechat", "onebot"]

dependencies = [
    # ── Web 框架 ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    # ── 数据 & 校验 ──
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0",
    # ── Agent 编排 ──
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    # ── 记忆 & 检索 ──
    "mem0ai>=0.1.0",
    "neo4j>=5.24.0",
    "networkx>=3.4.0",
    # ── LLM 路由 ──
    "litellm>=1.52.0",
    # ── 日志 ──
    "structlog>=24.4.0",
    # ── 工具 ──
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lingxi"]

# ── Ruff ──
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lingxi"]

# ── Pytest ──
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
pythonpath = ["src"]
filterwarnings = ["error"]

# ── Mypy ──
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["litellm.*", "mem0ai.*"]
ignore_missing_imports = true
