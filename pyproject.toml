[project]
name = "lingxi"
version = "0.1.0"
description = "智犀 (ZhiXi) — 智辨已知，犀照善为。二十四小时在线的全栈数字员工引擎。"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "LingXi Team" }]
keywords = ["agent", "ai", "customer-service", "qq", "wechat", "onebot"]

dependencies = [
    # ── Web 框架 ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    # ── 数据 & 校验 ──
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0",
    # ── Agent 编排 ──
    # langgraph 1.x 起 sqlite checkpointer 拆为官方配套包；锁大版本防 API 漂移
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    # ── 记忆 & 检索 ──
    "mem0ai>=0.1.0",
    "neo4j>=5.24.0",
    "networkx>=3.4.0",
    # ── LLM 路由 ──
    "litellm>=1.52.0",
    # ── 日志 ──
    "structlog>=24.4.0",
    # ── 工具 ──
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lingxi"]

# ── Ruff ──
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lingxi"]

# ── Pytest ──
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short -W ignore::DeprecationWarning:starlette.testclient -W ignore::DeprecationWarning:anyio._lazyimport"
pythonpath = ["src"]
filterwarnings = [
    # anyio 旧版别名被 starlette/fastapi 触发的第三方弃用警告，不影响本仓库
    "ignore:.*BlockingPortal.*:DeprecationWarning",
    # 其余所有 warning 升级为 error（严格模式）
    "error",
]

# ── Mypy ──
[tool.mypy]
# 3.12 是解析环境内 numpy stubs（PEP 695 type 语句）的最低要求；
# 实际兼容下限由 requires-python>=3.11 + ruff target-version=py311 把关
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["litellm.*"]
ignore_missing_imports = true
